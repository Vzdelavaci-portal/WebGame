<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGame #14 - Reverse Control</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #f1f5f9;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.game-box {
  width: 100%;
  max-width: 520px;
  background: white;
  padding: 24px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

h1 {
  margin-top: 0;
}

.info {
  color: #475569;
}

.game-area {
  position: relative;
  width: 100%;
  height: 360px;
  background: linear-gradient(#dbeafe, #eff6ff);
  border: 2px solid #0f172a;
  border-radius: 14px;
  overflow: hidden;
  margin: 20px 0;
}

.player {
  position: absolute;
  width: 36px;
  height: 36px;
  background: #2563eb;
  border-radius: 8px;
  left: 20px;
  top: 20px;
}

.goal {
  position: absolute;
  width: 44px;
  height: 44px;
  background: #22c55e;
  border-radius: 50%;
  right: 20px;
  bottom: 20px;
}

.obstacle {
  position: absolute;
  background: #ef4444;
  border-radius: 8px;
}

.obstacle.one {
  width: 180px;
  height: 26px;
  left: 80px;
  top: 90px;
}

.obstacle.two {
  width: 26px;
  height: 160px;
  left: 300px;
  top: 80px;
}

.obstacle.three {
  width: 170px;
  height: 26px;
  left: 120px;
  top: 250px;
}

.message {
  min-height: 24px;
  font-weight: bold;
}

button {
  margin-top: 10px;
  padding: 11px 18px;
  border: none;
  background: #0f172a;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 56px);
  gap: 8px;
  justify-content: center;
  margin-top: 12px;
}

.controls button {
  background: #2563eb;
  font-size: 20px;
  padding: 12px;
}

.empty {
  visibility: hidden;
}
</style>
</head>

<body>

<div class="game-box">
  <h1>WebGame #14 – Reverse Control</h1>
  <p class="info">Reach the green goal, but controls are reversed!</p>

  <div id="gameArea" class="game-area">
    <div id="player" class="player"></div>
    <div class="goal" id="goal"></div>

    <div class="obstacle one"></div>
    <div class="obstacle two"></div>
    <div class="obstacle three"></div>
  </div>

  <div id="message" class="message"></div>

  <div class="controls">
    <div class="empty"></div>
    <button onclick="movePlayer(0, 1)">↑</button>
    <div class="empty"></div>

    <button onclick="movePlayer(1, 0)">←</button>
    <button onclick="movePlayer(0, -1)">↓</button>
    <button onclick="movePlayer(-1, 0)">→</button>
  </div>

  <button onclick="restartGame()">Restart</button>
</div>

<script>
const gameArea = document.getElementById("gameArea");
const player = document.getElementById("player");
const goal = document.getElementById("goal");
const message = document.getElementById("message");

let playerX = 20;
let playerY = 20;
let step = 18;
let gameOver = false;

function drawPlayer() {
  player.style.left = playerX + "px";
  player.style.top = playerY + "px";
}

function movePlayer(dx, dy) {
  if (gameOver) return;

  playerX += dx * step;
  playerY += dy * step;

  const maxX = gameArea.clientWidth - player.offsetWidth;
  const maxY = gameArea.clientHeight - player.offsetHeight;

  if (playerX < 0) playerX = 0;
  if (playerY < 0) playerY = 0;
  if (playerX > maxX) playerX = maxX;
  if (playerY > maxY) playerY = maxY;

  drawPlayer();
  checkCollision();
  checkWin();
}

function checkCollision() {
  const playerRect = player.getBoundingClientRect();
  const obstacles = document.querySelectorAll(".obstacle");

  obstacles.forEach(obstacle => {
    const obstacleRect = obstacle.getBoundingClientRect();

    const collision =
      playerRect.left < obstacleRect.right &&
      playerRect.right > obstacleRect.left &&
      playerRect.top < obstacleRect.bottom &&
      playerRect.bottom > obstacleRect.top;

    if (collision) {
      gameOver = true;
      message.textContent = "Game Over! You hit an obstacle 😅";
      message.style.color = "red";
    }
  });
}

function checkWin() {
  const playerRect = player.getBoundingClientRect();
  const goalRect = goal.getBoundingClientRect();

  const win =
    playerRect.left < goalRect.right &&
    playerRect.right > goalRect.left &&
    playerRect.top < goalRect.bottom &&
    playerRect.bottom > goalRect.top;

  if (win) {
    gameOver = true;
    message.textContent = "You win! 🎉";
    message.style.color = "green";
  }
}

function restartGame() {
  playerX = 20;
  playerY = 20;
  gameOver = false;
  message.textContent = "";
  drawPlayer();
}

document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowUp") {
    movePlayer(0, 1);
  }

  if (e.key === "ArrowDown") {
    movePlayer(0, -1);
  }

  if (e.key === "ArrowLeft") {
    movePlayer(1, 0);
  }

  if (e.key === "ArrowRight") {
    movePlayer(-1, 0);
  }
});

drawPlayer();
</script>

</body>
</html>
